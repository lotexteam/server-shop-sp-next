name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "Где гонять job'ы"
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  contents: read

jobs:
  build:
    # push/PR — self-hosted (work-server); workflow_dispatch может выбрать hosted
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # NEXT_PUBLIC_* обязаны присутствовать на этапе build (вшиваются в бандл)
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080/api/v1
          NEXT_PUBLIC_MEDIA_BASE_URL: ""
          API_BASE_URL: http://127.0.0.1:8080/api/v1
          APP_URL: http://localhost:3000
