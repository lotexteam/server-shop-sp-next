name: Deploy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Один деплой за раз ВНУТРИ репозитория. Межрепозиторная гонка (две витрины
# на одну VM) блокируется VM lock в scripts/update.sh — одинаковый group в
# разных репозиториях GitHub НЕ взаимоисключает (concurrency локальна репо).
concurrency:
  group: deploy-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Update on server
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REF_TYPE,REF_NAME
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            ./scripts/update.sh --ref-type "$REF_TYPE" --ref "$REF_NAME"
